<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Lonely Knight</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Chess Lonely Knight</h1>

    <div class="form-group">
      <label for="row">Row</label>
      <input type="number" id="row" min="1" max="100" value="8" required>
    </div>

    <div class="form-group">
      <label for="column">Column</label>
      <input type="number" id="column" min="1" max="100" value="8" required>
    </div>

    <button id="generate-btn" type="button">Generate Board</button>

    <div id="board-container"></div>
  </main>
</body>
</html>
